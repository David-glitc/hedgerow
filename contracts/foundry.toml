[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
